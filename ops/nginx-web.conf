# web 单元的 nginx 配置。只做两件事：SPA 回退 + 让 PWA 资源可被正确缓存。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端是 SPA，/garden、/wish/:id 这些路径在磁盘上没有对应文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker 与 manifest 绝不能被缓存住：
    # 缓存住 sw.js 等于用户永远拿不到下一版（SMOKE-core-16 逐个 GET 它们）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
}
