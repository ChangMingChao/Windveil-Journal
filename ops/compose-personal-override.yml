# personal 局域网部署专用覆盖（未被 git 跟踪的辅助文件，配合 ops/personal.sh 使用）。
#
# 为什么不用 Caddyfile：Caddy 2.8.4 的 Caddyfile 适配器会丢弃全局 default_sni
# （最小复现：{default_sni X} + 任意站点 → adapt 后 apps.tls 为空），
# 而手机浏览器按 IP 访问时不发送 SNI，没有 default_sni 就无法选证书，
# TLS 握手直接失败（alert internal error）。
# 解法：caddy adapt 生成 JSON 后注入 apps.tls.connection_policies[].default_sni，
# 让 Caddy 直接加载原生 JSON（见 ops/personal.sh 的 regen 步骤）。
#
# 注意：JSON 里固化了局域网 IP（10.101.165.220）。IP 变化后需重跑
# `bash ops/personal.sh regen` 再 `bash ops/personal.sh up`。
services:
  caddy:
    command: run --config /etc/caddy/caddy-personal.json
    volumes:
      - ./caddy-personal.json:/etc/caddy/caddy-personal.json:ro
