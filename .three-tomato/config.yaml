# three-tomato 配置 — Windveil Journal（未发生事件管理局）
# 变更提案：android-native-app（logos/changes/android-native-app/proposal.md）
# 输入：.three-tomato/requirements/（PRD.md + 6 个 OpenAPI yaml）

# 目标平台：仅 Android（用户指定）
platforms:
  - android

# AI-Friendly 技术栈（原生优先，数据集大）
tech_stack:
  android:
    language: kotlin
    ui: compose
    architecture: mvvm
    di: hilt
    network: retrofit + okhttp
    async: coroutines
    image: coil
    min_sdk: 26
    target_sdk: 34

# 协议保留：后端为 REST/JSON（见 requirements/*.yaml），Android 端使用标准 HTTP 客户端
# 认证：自管 JWT —— access token (Bearer, 15min) + refresh token (httpOnly Cookie, 30d)
# 输出设置
output:
  directory: .three-tomato/output
  include_tests: true
  include_docs: true
  language: zh-CN
