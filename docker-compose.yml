# 单机 Docker Compose 部署（部署方案 §2）。三个运行单元 + Caddy + 可选 MinIO。
#
# 数据库不是服务，是 db-data 卷里的一个 SQLite 文件。因此：
#   * api 与 scheduler 挂同一个卷，共享同一个文件（SQLite 单写者，写入串行化）
#   * 卷的持久化与备份是这套部署的第一等公民（§3.3、§5）
#   * scheduler 必须单活：replicas 固定 1，进程内另有文件锁兜底

name: unhappened

x-app-env: &app-env
  APP_ENV: ${APP_ENV:?APP_ENV 必须显式设置}
  APP_BASE_URL: ${APP_BASE_URL:?}
  # DATABASE_URL 从 .env 来而不是写死在这里：部署方案 §3.2 把它列为密钥项，
  # 并且警告「配错会建出一个空库，不会报错」——写死等于把这个风险藏起来，
  # 而 check-env.sh 就再也看不到它。路径必须落在 db-data 卷内。
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必须指向 /data 卷内的文件}
  JWT_SECRET: ${JWT_SECRET:?}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
  LLM_BASE_URL: ${LLM_BASE_URL:?}
  LLM_API_KEY: ${LLM_API_KEY:?}
  LLM_MODEL: ${LLM_MODEL:?}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-5}
  ASR_BASE_URL: ${ASR_BASE_URL:?}
  ASR_API_KEY: ${ASR_API_KEY:?}
  ASR_MODEL: ${ASR_MODEL:?}
  ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-15}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-unhappened-media}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:?}
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: ${SMTP_FROM:?}
  VAPID_SUBJECT: ${VAPID_SUBJECT:?}
  REMINDER_WEEKLY_BUDGET: ${REMINDER_WEEKLY_BUDGET:-3}
  SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-300}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 必须显式设置（域名或 localhost）}
      ACME_EMAIL: ${ACME_EMAIL:-ops@unhappened.local}
      # 对象存储路由的前缀必须等于 bucket 名，理由见 Caddyfile 里那段注释
      S3_BUCKET: ${S3_BUCKET:-unhappened-media}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  # 静态产物由宿主构建（部署方案 §4.2：pnpm build → frontend/dist），
  # 这里只负责把它端出去。因此 web 的「发布」就是重建 dist 后 up -d --no-deps web，
  # 「回滚」就是切回上一个 git sha 重新 build。
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ops/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    image: unhappened-api:${IMAGE_TAG:?IMAGE_TAG 必须是本次发布的 git sha，不能用 latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment: *app-env
    volumes:
      # 部署方案 §3.3：`.db` 必须落在命名卷**或宿主目录**，不能留在容器可写层。
      #
      # 默认命名卷，而且在 Docker Desktop for Windows / macOS 上**只能**用命名卷：
      # SQLite 的 WAL 需要 `-shm` 共享内存映射，而这类平台的宿主目录挂载
      # （9p / gRPC-FUSE）不支持它。api 与 scheduler 两个进程同时打开同一个文件时
      # 会撞出 `sqlite3.OperationalError: disk I/O error`——本次 staging 演练
      # 就是这么发现的。Linux 宿主上的 bind mount 没有这个限制，
      # 需要让宿主直接读写 `.db`（备份、部署后检查）时可以设 DB_DIR=./data。
      - ${DB_DIR:-db-data}:/data
    depends_on:
      minio:
        condition: service_started
        required: false

  scheduler:
    image: unhappened-api:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    environment: *app-env
    # 单活是硬约束：SQLite 没有咨询锁，多实例会同时投递同一条提醒。
    # 进程内的文件锁是第二道防线，这里的 replicas: 1 是第一道。
    deploy:
      replicas: 1
    # 不能沿用镜像里那条 curl /health 的探针——scheduler 不监听 HTTP，
    # 沿用的结果是永久 unhealthy。它的存活信号是心跳行本身（部署方案 §7-2）。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sqlite3,datetime as d;
          p=os.environ['DATABASE_URL'].split('///')[-1];
          c=sqlite3.connect(f'file:{p}?mode=ro',uri=True);
          t=c.execute('SELECT last_beat_at FROM scheduler_heartbeat WHERE id=1').fetchone()[0];
          age=(d.datetime.now(d.UTC)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds();
          raise SystemExit(0 if age < 2*int(os.environ.get('SCHEDULER_INTERVAL_SECONDS','300')) else 1)"
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    volumes:
      - ${DB_DIR:-db-data}:/data
    depends_on:
      - api

  # production 用托管对象存储时不启用它（--profile 不带 storage）
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
