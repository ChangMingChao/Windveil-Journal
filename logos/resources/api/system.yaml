openapi: 3.1.0
info:
  title: "未发生事件管理局 — 系统与测试后门 API"
  version: "0.1.0"
  description: |
    来源：架构概要第六节（健康检查）与第七节（外部依赖测试策略）。
    /test/* 下的端点仅在 APP_ENV=test 时注册路由，生产构建中该模块不存在。
servers:
  - url: "https://{host}"
    variables:
      host:
        default: "localhost:8000"
tags:
  - name: system
    description: "健康检查"
  - name: test
    description: "仅测试环境可用的断言后门"

paths:
  /api/v1/health:
    get:
      operationId: healthCheck
      tags: [system]
      summary: "健康检查"
      description: "来源：架构概要第八节交接项。含数据库连通性；scheduler 的存活由心跳表判断，不在本端点内。"
      security: []
      responses:
        '200':
          description: "健康"
          content:
            application/json:
              schema:
                type: object
                required: [status, database, scheduler_heartbeat_age_seconds]
                properties:
                  status: { type: string, const: "ok" }
                  database: { type: string, enum: [ok, degraded] }
                  scheduler_heartbeat_age_seconds:
                    type: [integer, "null"]
                    description: "距 scheduler 上次心跳的秒数；超过 900 应告警"
        '503':
          description: "数据库不可用"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/test/outbox:
    get:
      operationId: testReadOutbox
      tags: [test]
      summary: "读取提醒 outbox（测试断言用）"
      description: "来源：架构概要外部依赖表 Web Push 的 env-disable + test-api 策略。用于断言 S03 EX-14.1 的周预算与 EX-14.2 的去重。"
      security: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: week_start
          in: query
          required: false
          schema: { type: string, format: date }
          description: "按自然周过滤，用于断言每周 3 条上限"
      responses:
        '200':
          description: "该用户的 outbox 记录"
          content:
            application/json:
              schema:
                type: object
                required: [items, delivered_count_this_week]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [wish_id, kind, status, timing_occurrence]
                      properties:
                        wish_id: { type: string, format: uuid }
                        kind: { type: string, enum: [timing, stale_care] }
                        channel: { type: [string, "null"], enum: [push, email, null] }
                        status:
                          type: string
                          enum: [pending, delivered, failed, deferred_to_next_week]
                        timing_occurrence:
                          type: string
                          description: "同一时机的唯一标识，(wish_id, timing_occurrence, kind) 唯一"
                        body: { type: string }
                        attempts: { type: integer }
                  delivered_count_this_week:
                    type: integer
                    description: "断言 ≤3；投递失败不计入（EX-16.2）"
        '404':
          description: "非测试环境下该路由不存在"

  /api/test/latest-email:
    get:
      operationId: testReadLatestEmail
      tags: [test]
      summary: "读取最近一封邮件（测试断言用）"
      description: "来源：架构概要外部依赖表邮件服务的 test-api 策略。用于断言 S03 EX-16.1 的邮件兜底通道与文案。"
      security: []
      parameters:
        - name: to
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: "最近一封邮件"
          content:
            application/json:
              schema:
                type: object
                required: [to, subject, body, sent_at]
                properties:
                  to: { type: string, format: email }
                  subject: { type: string }
                  body: { type: string }
                  sent_at: { type: string, format: date-time }
        '404':
          description: "无匹配邮件，或非测试环境下该路由不存在"

  /api/test/clock:
    post:
      operationId: testSetClock
      tags: [test]
      summary: "注入固定时间（测试断言用）"
      description: "来源：架构概要外部依赖表「系统时钟」的 fixed-value 策略。用于断言时机到达、60 天停滞（S04 EX-15.2）、发生日期早于种下日期（S06 EX-3.1）。"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now:
                  type: [string, "null"]
                  format: date-time
                  description: "置 null 表示恢复真实时钟"
      responses:
        '204':
          description: "已生效，服务层 Clock 抽象返回该时间"
        '404':
          description: "非测试环境下该路由不存在"

  /api/test/scheduler/tick:
    post:
      operationId: testTriggerSchedulerTick
      tags: [test]
      summary: "手动触发一次调度扫描（测试与 smoke 用）"
      description: "来源：架构概要第八节 smoke 最小链路「手动触发 scheduler 一次」。同步执行一轮扫描并返回处理结果。"
      security: []
      responses:
        '200':
          description: "本轮处理结果"
          content:
            application/json:
              schema:
                type: object
                required: [scanned, enqueued, deferred, delivered, failed]
                properties:
                  scanned: { type: integer }
                  enqueued: { type: integer }
                  deferred: { type: integer }
                  delivered: { type: integer }
                  failed: { type: integer }
        '404':
          description: "非测试环境下该路由不存在"

components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
