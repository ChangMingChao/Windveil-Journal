openapi: 3.1.0
info:
  title: "未发生事件管理局 — 认证与个人空间 API"
  version: "0.1.0"
  description: |
    来源：S01 时序图（core-S01-onboarding-first-wish.md）与架构概要 3.2 节的自管 JWT 方案。
    设计原则：首次体验不出现任何表单，个人空间以匿名主体建立；邮箱绑定为后置的可选动作。
servers:
  - url: "https://{host}/api/v1"
    variables:
      host:
        default: "localhost:8000"
security:
  - bearerAuth: []
tags:
  - name: auth
    description: "匿名建号、邮箱绑定、令牌管理"
  - name: onboarding
    description: "首次体验的温柔问题"
  - name: preferences
    description: "偏好与可用时段的管理（S08）。来源：core-S08-preferences-availability.md。"


paths:
  /auth/anonymous:
    post:
      operationId: createAnonymousSpace
      tags: [auth]
      summary: "无表单建立匿名个人空间"
      description: "来源：S01 Step 3 → Step 6。用户点「开始」即建号，同时置 onboarded_at，使 EX-12.1（跳过后未输入即离开）不会重复首次体验。"
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  description: "IANA 时区名，用于计算自然周与季节触发"
                  default: "Asia/Shanghai"
      responses:
        '201':
          description: "个人空间已建立，refresh token 以 httpOnly Cookie 下发"
          headers:
            Set-Cookie:
              description: "refresh_token=<jwt>; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '503':
          description: "建号失败，DB 不可用（EX-3.1）。前端保留本地草稿并提示「这里暂时打不开，你写的还在这台设备上」"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/link-email:
    post:
      operationId: linkEmail
      tags: [auth]
      summary: "为匿名空间绑定邮箱与密码"
      description: "来源：S01「待补设计 1」。不绑定邮箱的用户换设备后将永久失去愿望，因此该端点是 MVP 必需项，但其界面尚未在 Phase 2 定义。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: "绑定成功，账号从匿名转为可跨设备登录"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '409':
          description: "该邮箱已被其他账号占用（EMAIL_ALREADY_LINKED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "邮箱格式非法或密码不足 8 位（VALIDATION_FAILED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: "已绑定邮箱的用户在新设备登录"
      description: "来源：S01「待补设计 1」的必然结果，时序图中无对应箭头。绑定能力若不落地，本端点应一并删除。"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: "登录成功"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401':
          description: "邮箱或密码不正确（INVALID_CREDENTIALS）。响应文案不区分「邮箱不存在」与「密码错误」，避免账号枚举"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: "尝试过于频繁（RATE_LIMITED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: "用 httpOnly Cookie 换新的 access token"
      description: "来源：架构概要 3.2（access 15 分钟 / refresh 30 天）。时序图未画，属基础设施端点。"
      security: []
      responses:
        '200':
          description: "签发新的 access token 并轮换 refresh token"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401':
          description: "refresh token 缺失、过期或已被撤销（REFRESH_INVALID）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: "撤销当前 refresh token"
      description: "来源：IA 5.4 的 /me 页面。撤销后 Cookie 立即失效。"
      responses:
        '204':
          description: "已登出，无响应体"

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: "读取当前用户资料与首次体验状态"
      description: "来源：S01 EX-12.1。前端据 onboarded_at 是否为空决定进入 /welcome 还是 /garden。"
      responses:
        '200':
          description: "当前用户资料"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /onboarding/answers:
    post:
      operationId: submitOnboardingAnswers
      tags: [onboarding]
      summary: "提交温柔问题的回答，可为空数组"
      description: "来源：S01 Step 9 → Step 11。跳过全部问题时提交空数组；写入失败也返回 204（EX-10.1），不为增强项中断首次体验。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [question_key]
                    properties:
                      question_key:
                        type: string
                        description: "问题标识，如 wanted_but_not_done"
                      answer_text:
                        type: [string, "null"]
                        maxLength: 500
                        description: "可为 null 表示该题留空"
      responses:
        '204':
          description: "已收下（写入失败时同样返回 204，见 EX-10.1）"
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /me/preferences:
    get:
      operationId: listPreferences
      tags: [preferences]
      summary: "查看「它记得我什么」"
      description: "来源：S08 Step 2 → Step 6。默认不含已撤回行；摘要（kind=digest）随列表返回。响应不含任何统计字段。"
      parameters:
        - name: include_revoked
          in: query
          schema: { type: boolean, default: false }
          description: "true 时附带已撤回痕迹（S08 EX-14.1 的审计回看）"
      responses:
        '200':
          description: "偏好列表与摘要"
          content:
            application/json:
              schema:
                type: object
                required: [items, digest]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PreferenceItem' }
                  digest:
                    oneOf:
                      - $ref: '#/components/schemas/PreferenceItem'
                      - type: "null"
                    description: "「它的理解」摘要行（kind=digest），无则为 null；同样可查看、可删除"
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    put:
      operationId: declarePreference
      tags: [preferences]
      summary: "声明一条偏好"
      description: "来源：S08 Step 7 → Step 11。服务端强制 source=declared、confidence=100，请求中的任何 source/confidence 字段被忽略；同 key 的 inferred 行保持原样并列（不覆盖）。响应只含元数据，不回显 value 明文（敏感值不回显）。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pref_key, value]
              properties:
                pref_key:
                  type: string
                  enum: [relaxation, pace, companion, budget, other]
                  description: "主题标签映射的偏好键，与 P6 声明输入的主题胶囊一一对应"
                value:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: "已记下（UPSERT）；响应为元数据，value 明文不回显"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceMeta' }
        '422':
          description: "value 为空或超 200 字（VALIDATION_FAILED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/preferences/{pref_id}/revoke:
    parameters:
      - name: pref_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revokePreference
      tags: [preferences]
      summary: "撤回一条模型推断（猜错了）"
      description: "来源：S08 Step 12 → Step 16。置 revoked_at 保留审计痕迹并立即退出一切判断；同事务把引用该条目的 pending 时机建议置 expired（S03 EX-P.5）。仅 source=inferred 且未撤回的行可撤回。"
      responses:
        '200':
          description: "已撤回；该条进入已撤回痕迹"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceItem' }
        '409':
          description: "目标行是用户声明（declared）、已撤回或不存在于当前用户（PREFERENCE_NOT_REVOCABLE，S08 EX-14.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/preferences/{pref_id}:
    parameters:
      - name: pref_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePreference
      tags: [preferences]
      summary: "彻底删除一条偏好（含摘要行）"
      description: "来源：S08 Step 17 → Step 20。硬删除，不可恢复；不出现在任何导出、摘要或后续模型上下文中；同事务失效引用它的 pending 时机建议（S08 EX-19.1）。对 digest 行同样适用——删除后下一周期自然重建。"
      responses:
        '204':
          description: "已彻底删除"
        '404':
          description: "不存在、已删除或不属于当前用户（PREFERENCE_NOT_FOUND）；不暴露存在性"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/availability:
    get:
      operationId: listAvailability
      tags: [preferences]
      summary: "查看可用时段"
      description: "来源：S08 Step 2 → Step 6。按 weekday 升序、start_minute 升序返回；free_weekend 类时机计算以此为依据。"
      responses:
        '200':
          description: "可用时段列表"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityWindow' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      operationId: createAvailabilityWindow
      tags: [preferences]
      summary: "新增一个可用时段"
      description: "来源：S08 Step 21 → Step 25。结构化字段：周几（0=周一，ISO）+ 当天分钟区间；跨午夜段由前端拆为两行提交。note 是用户刚写下的备忘，保存响应原样返回（敏感值不回显的边界是：日志、错误响应与跨用户访问不出现明文）。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, start_minute, end_minute]
              properties:
                weekday: { type: integer, minimum: 0, maximum: 6 }
                start_minute: { type: integer, minimum: 0, maximum: 1439 }
                end_minute: { type: integer, minimum: 1, maximum: 1440 }
                note:
                  type: string
                  maxLength: 50
                  description: "可选备注，如「带孩子出门前」；应用层加密"
      responses:
        '201':
          description: "已保存"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityWindow' }
        '422':
          description: "end_minute <= start_minute、weekday 越界或分钟越界（AVAILABILITY_INVALID，S08 EX-23.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/availability/{window_id}:
    parameters:
      - name: window_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateAvailabilityWindow
      tags: [preferences]
      summary: "修改一个可用时段"
      description: "来源：S08 设计文档「可用时段」区的编辑动作。校验规则与 POST 相同。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                weekday: { type: integer, minimum: 0, maximum: 6 }
                start_minute: { type: integer, minimum: 0, maximum: 1439 }
                end_minute: { type: integer, minimum: 1, maximum: 1440 }
                note:
                  type: [string, "null"]
                  maxLength: 50
      responses:
        '200':
          description: "已更新"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityWindow' }
        '422':
          description: "字段非法（AVAILABILITY_INVALID，S08 EX-23.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "不存在或不属于当前用户（AVAILABILITY_NOT_FOUND）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteAvailabilityWindow
      tags: [preferences]
      summary: "删除一个可用时段"
      description: "来源：S08 Step 17 → Step 20。硬删除；同事务失效引用它的 pending 时机建议。"
      responses:
        '204':
          description: "已删除"
        '404':
          description: "不存在或不属于当前用户（AVAILABILITY_NOT_FOUND）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/notification-channels:
    patch:
      operationId: updateNotificationChannels
      tags: [auth]
      summary: "切换提醒通道开关（S10）"
      description: |
        来源：S10 Step 6 → Step 10。读写 users.push_enabled / email_enabled（既有列）。
        请求只含变更的字段（minProperties: 1）；切换立即生效，无冷静期。
        投递侧语义：推送关闭时投递直接走邮件；全部关闭时 outbox 的 pending 记录
        顺延保留、重开后恢复（S10 EX-D2.1）——已确认的时机不因关通道丢失。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                push_enabled: { type: boolean }
                email_enabled: { type: boolean }
      responses:
        '200':
          description: "已更新；返回完整开关状态"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannels' }
        '422':
          description: "请求体为空或无已知字段（VALIDATION_FAILED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "access token，有效期 15 分钟；refresh token 走 httpOnly Cookie，不在 Authorization 头中出现"

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "机器可读错误码，如 INVALID_CREDENTIALS"
        message:
          type: string
          description: "人类可读描述。面向用户的文案禁止出现「任务」「逾期」「未完成」等词"
        details:
          type: object
          additionalProperties: true
          description: "字段级校验错误等附加信息"

    AuthResult:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: "Bearer" }
        expires_in:
          type: integer
          description: "access token 剩余秒数，固定 900"
        user: { $ref: '#/components/schemas/UserProfile' }

    UserProfile:
      type: object
      required: [id, is_anonymous, onboarded_at, timezone]
      properties:
        id: { type: string, format: uuid }
        email:
          type: [string, "null"]
          format: email
          description: "未绑定邮箱时为 null"
        is_anonymous:
          type: boolean
          description: "true 表示尚未绑定邮箱，换设备后无法找回"
        onboarded_at:
          type: [string, "null"]
          format: date-time
          description: "首次体验完成时间。非空即不再进入 /welcome（EX-12.1）"
        timezone:
          type: string
          description: "IANA 时区名，提醒周预算按该时区的自然周计算"
        push_enabled:
          type: boolean
          description: "推送通道开关（S10）。关闭时投递直接走邮件；两个都关则完全静默"
        email_enabled:
          type: boolean
          description: "邮件通道开关（S10）。iOS Safari 未添加主屏时建议保持开启"
        created_at: { type: string, format: date-time }

    PreferenceItem:
      type: object
      required: [id, kind, pref_key, source, value, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [entry, digest]
          description: "entry 为单条偏好；digest 为 LLM 定期生成的摘要（S08 摘要支线 D1–D4）"
        pref_key:
          type: string
          description: "entry 行为主题键（relaxation/pace/companion/budget/other）；digest 行恒为 overall"
        source:
          type: string
          enum: [declared, inferred]
          description: "你说过的 / 我猜的"
        confidence:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: "declared 恒为 100；inferred 由模型给出。前端映射为「比较确定 / 大概猜的」，不展示裸数字"
        value:
          type: string
          description: "服务端解密后的明文，仅 GET 返回本人；写接口的响应不回显"
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: "非 null 即已撤回，仅 include_revoked=true 时返回"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PreferenceMeta:
      type: object
      description: "写操作响应：只含元数据，不含 value 明文（敏感值不回显）"
      required: [id, kind, pref_key, source, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [entry, digest] }
        pref_key: { type: string }
        source: { type: string, enum: [declared, inferred] }
        confidence: { type: [integer, "null"], minimum: 0, maximum: 100 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AvailabilityWindow:
      type: object
      required: [id, weekday, start_minute, end_minute, created_at]
      properties:
        id: { type: string, format: uuid }
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: "0=周一（ISO 8601），6=周日"
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_minute: { type: integer, minimum: 1, maximum: 1440 }
        note:
          type: [string, "null"]
          description: "服务端解密后的备注明文，仅 GET 返回本人"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationChannels:
      type: object
      required: [push_enabled, email_enabled]
      properties:
        push_enabled:
          type: boolean
          description: "推送通道开关；关闭后投递不再尝试推送"
        email_enabled:
          type: boolean
          description: "邮件通道开关；关闭后投递不再尝试邮件。两个都关 = 完全静默（pending 顺延保留）"
