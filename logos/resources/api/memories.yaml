openapi: 3.1.0
info:
  title: "未发生事件管理局 — 已发生之书 API"
  version: "0.1.0"
  description: |
    来源：S06 时序图（core-S06-write-memory-page.md）。
    两条产品约束直接体现在接口形状上：
    1. 全部区块可为空仍可发布——不存在任何非空校验（S06 EX-13.1 对应的验收条件）。
    2. 发生日期早于种下日期不拦截，只回一个 warning 让前端用询问式确认（EX-3.1）。
servers:
  - url: "https://{host}/api/v1"
    variables:
      host:
        default: "localhost:8000"
security:
  - bearerAuth: []
tags:
  - name: memories
    description: "记忆页草稿、编辑、发布与书架"

paths:
  /wishes/{wish_id}/happened:
    parameters:
      - name: wish_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markWishHappened
      tags: [memories]
      summary: "它已经发生了（创建记忆页草稿）"
      description: "来源：S06 Step 3 → Step 10。本步即清空 next_trigger_at 并删除待投递提醒，但愿望状态要到 publish 才转 happened（S06 步骤说明）。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [happened_from]
              properties:
                happened_from:
                  type: string
                  format: date
                  description: "发生日期（单日）或区间起始"
                happened_to:
                  type: [string, "null"]
                  format: date
                  description: "区间结束；单日时省略或为 null"
                acknowledged_before_seeded:
                  type: boolean
                  default: false
                  description: "用户已确认「它比你写下它的时候更早发生」（EX-3.1）"
      responses:
        '201':
          description: "草稿已创建。degraded=true 表示 LLM 草拟失败，标题回退为愿望原标题、起因回退为原话引用、经过为空（EX-7.1）。warning 非空表示日期早于种下时间且尚未确认"
          content:
            application/json:
              schema:
                type: object
                required: [memory, degraded]
                properties:
                  memory: { $ref: '#/components/schemas/Memory' }
                  degraded: { type: boolean }
                  warning:
                    oneOf:
                      - $ref: '#/components/schemas/Warning'
                      - type: "null"
        '404':
          description: "愿望不存在或不属于当前用户（WISH_NOT_FOUND）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "发生日期在未来（HAPPENED_DATE_IN_FUTURE，EX-3.2）或区间倒置（HAPPENED_RANGE_INVALID，EX-3.3）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: "已发生之书书架"
      description: "来源：S06 Step 20。按发生时间倒序，只返回 published。lived_pages 是产品内唯一允许的计数——它数的是已经发生的事。"
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: "书架列表"
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, lived_pages]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MemoryCard' }
                  next_cursor: { type: [string, "null"] }
                  lived_pages:
                    type: integer
                    description: "「你已经活过的 N 页」"

  /memories/{memory_id}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      operationId: getMemory
      tags: [memories]
      summary: "单页记忆（阅读态或草稿）"
      description: "来源：S06 Step 20。草稿与已发布共用同一端点，由 status 区分。"
      responses:
        '200':
          description: "记忆页"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '404':
          description: "不存在或不属于当前用户（MEMORY_NOT_FOUND）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: "保存记忆页编辑"
      description: "来源：S06 Step 12 → Step 14。所有字段均可为空或置 null；不做任何非空校验。用户手动改过的字段会被标记，Scheduler 补草拟时不覆盖（EX-7.1）。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: [string, "null"], maxLength: 80 }
                cause: { type: [string, "null"], maxLength: 2000 }
                process: { type: [string, "null"], maxLength: 4000 }
                mood:
                  type: [string, "null"]
                  enum: [relieved, healed, tearful, calm, proud, unspeakable, null]
                  description: "6 个低饱和词，可为 null 表示不选"
                last_line: { type: [string, "null"], maxLength: 300 }
                photo_media_ids:
                  type: array
                  maxItems: 9
                  items: { type: string, format: uuid }
                voice_media_id: { type: [string, "null"], format: uuid }
      responses:
        '200':
          description: "已保存"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '404':
          description: "记忆页或引用的媒体不存在（MEMORY_NOT_FOUND / MEDIA_NOT_FOUND，EX-12.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "照片超过 9 张（MEDIA_LIMIT_EXCEEDED，EX-12.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /memories/{memory_id}/publish:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: publishMemory
      tags: [memories]
      summary: "收进书里"
      description: "来源：S06 Step 16 → Step 19。一个事务内把 memories 置 published 并把 wishes 转 happened 终态。幂等（EX-17.1）。"
      responses:
        '200':
          description: "已入册；重复提交同样返回 200，不重复计数"
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory: { $ref: '#/components/schemas/Memory' }
        '404':
          description: "愿望已在另一端被彻底删除，草稿一并失效（WISH_NOT_FOUND，EX-18.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [HAPPENED_BEFORE_SEEDED]
        message:
          type: string
          description: "供前端做询问式确认的文案，如「它比你写下它的时候更早发生了吗？」"

    MemoryCard:
      type: object
      required: [id, wish_id, title, happened_from, status]
      properties:
        id: { type: string, format: uuid }
        wish_id: { type: string, format: uuid }
        title: { type: string }
        happened_from: { type: string, format: date }
        happened_to: { type: [string, "null"], format: date }
        cover_media_id:
          type: [string, "null"]
          format: uuid
          description: "首图；为 null 时前端渲染纸色书脊纹样"
        status:
          type: string
          enum: [draft, published]

    Memory:
      allOf:
        - $ref: '#/components/schemas/MemoryCard'
        - type: object
          properties:
            cause:
              type: [string, "null"]
              description: "起因，草拟时引用原始期待，如「你原本想逃离一点压力。」"
            process:
              type: [string, "null"]
              description: "经过，依据准备过程时间线草拟；无时间线时为 null，前端显示占位（EX-4.1）"
            mood:
              type: [string, "null"]
              enum: [relieved, healed, tearful, calm, proud, unspeakable, null]
            last_line: { type: [string, "null"] }
            photo_media_ids:
              type: array
              items: { type: string, format: uuid }
            voice_media_id: { type: [string, "null"], format: uuid }
            note_before_seeded:
              type: boolean
              description: "true 时阅读态在日期下方注明「你是在它发生之后才写下它的」（EX-3.1）"
            edited_fields:
              type: array
              description: "用户手动编辑过的字段名，Scheduler 补草拟时跳过这些字段（EX-7.1）"
              items:
                type: string
                enum: [title, cause, process]
            published_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }


