# delta — api/auth.yaml（preferences-availability-timing）

## ADDED — tag: preferences

```yaml
  - name: preferences
    description: "偏好与可用时段的管理（S08）。来源：core-S08-preferences-availability.md。"
```

## ADDED — GET /me/preferences

```yaml
  /me/preferences:
    get:
      operationId: listPreferences
      tags: [preferences]
      summary: "查看「它记得我什么」"
      description: "来源：S08 Step 2 → Step 6。默认不含已撤回行；摘要（kind=digest）随列表返回。响应不含任何统计字段。"
      parameters:
        - name: include_revoked
          in: query
          schema: { type: boolean, default: false }
          description: "true 时附带已撤回痕迹（S08 EX-14.1 的审计回看）"
      responses:
        '200':
          description: "偏好列表与摘要"
          content:
            application/json:
              schema:
                type: object
                required: [items, digest]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PreferenceItem' }
                  digest:
                    oneOf:
                      - $ref: '#/components/schemas/PreferenceItem'
                      - type: "null"
                    description: "「它的理解」摘要行（kind=digest），无则为 null；同样可查看、可删除"
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
```

## ADDED — PUT /me/preferences

```yaml
    put:
      operationId: declarePreference
      tags: [preferences]
      summary: "声明一条偏好"
      description: "来源：S08 Step 7 → Step 11。服务端强制 source=declared、confidence=100，请求中的任何 source/confidence 字段被忽略；同 key 的 inferred 行保持原样并列（不覆盖）。响应只含元数据，不回显 value 明文（敏感值不回显）。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pref_key, value]
              properties:
                pref_key:
                  type: string
                  enum: [relaxation, pace, companion, budget, other]
                  description: "主题标签映射的偏好键，与 P6 声明输入的主题胶囊一一对应"
                value:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: "已记下（UPSERT）；响应为元数据，value 明文不回显"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceMeta' }
        '422':
          description: "value 为空或超 200 字（VALIDATION_FAILED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
```

## ADDED — POST /me/preferences/{pref_id}/revoke

```yaml
  /me/preferences/{pref_id}/revoke:
    parameters:
      - name: pref_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revokePreference
      tags: [preferences]
      summary: "撤回一条模型推断（猜错了）"
      description: "来源：S08 Step 12 → Step 16。置 revoked_at 保留审计痕迹并立即退出一切判断；同事务把引用该条目的 pending 时机建议置 expired（S03 EX-P.5）。仅 source=inferred 且未撤回的行可撤回。"
      responses:
        '200':
          description: "已撤回；该条进入已撤回痕迹"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceItem' }
        '409':
          description: "目标行是用户声明（declared）、已撤回或不存在于当前用户（PREFERENCE_NOT_REVOCABLE，S08 EX-14.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
```

## ADDED — DELETE /me/preferences/{pref_id}

```yaml
  /me/preferences/{pref_id}:
    parameters:
      - name: pref_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePreference
      tags: [preferences]
      summary: "彻底删除一条偏好（含摘要行）"
      description: "来源：S08 Step 17 → Step 20。硬删除，不可恢复；不出现在任何导出、摘要或后续模型上下文中；同事务失效引用它的 pending 时机建议（S08 EX-19.1）。对 digest 行同样适用——删除后下一周期自然重建。"
      responses:
        '204':
          description: "已彻底删除"
        '404':
          description: "不存在、已删除或不属于当前用户（PREFERENCE_NOT_FOUND）；不暴露存在性"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
```

