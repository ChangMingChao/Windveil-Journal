## ADDED — POST /me/availability

```yaml
    post:
      operationId: createAvailabilityWindow
      tags: [preferences]
      summary: "新增一个可用时段"
      description: "来源：S08 Step 21 → Step 25。结构化字段：周几（0=周一，ISO）+ 当天分钟区间；跨午夜段由前端拆为两行提交。note 是用户刚写下的备忘，保存响应原样返回（敏感值不回显的边界是：日志、错误响应与跨用户访问不出现明文）。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, start_minute, end_minute]
              properties:
                weekday: { type: integer, minimum: 0, maximum: 6 }
                start_minute: { type: integer, minimum: 0, maximum: 1439 }
                end_minute: { type: integer, minimum: 1, maximum: 1440 }
                note:
                  type: string
                  maxLength: 50
                  description: "可选备注，如「带孩子出门前」；应用层加密"
      responses:
        '201':
          description: "已保存"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityWindow' }
        '422':
          description: "end_minute <= start_minute、weekday 越界或分钟越界（AVAILABILITY_INVALID，S08 EX-23.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
```

