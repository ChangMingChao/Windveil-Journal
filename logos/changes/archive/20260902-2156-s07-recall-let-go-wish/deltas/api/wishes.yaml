## ADDED — /wishes/{wish_id}/recall

  /wishes/{wish_id}/recall:
    parameters:
      - $ref: '#/components/parameters/WishId'
    post:
      operationId: recallWish
      tags: [wishes]
      summary: "重新种下"
      description: "来源：S07 Step 14 → Step 18。仅 let_go 状态可用；保留首次种下时间、标题、原话、照片、理解结果与准备过程，清空 let_go_at 与旧时机字段，状态回 seeded。"
      responses:
        '200':
          description: "已重新种下，用户可继续复用 S03 约定时机"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishDetail' }
        '404':
          description: "愿望不存在或不属于当前用户（WISH_NOT_FOUND，S07 EX-8.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "当前状态不允许重新种下（STATE_TRANSITION_NOT_ALLOWED，S07 EX-10.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

## MODIFIED — WishCard

    WishCard:
      type: object
      required: [id, title, seeded_at, state, timing, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        original_text_excerpt:
          type: string
          description: "原话摘要，卡面单行截断用"
        seeded_at: { type: string, format: date-time }
        let_go_at:
          type: [string, "null"]
          format: date-time
          description: "安静放下时间。仅 state=let_go 时通常有值；历史兼容数据可为 null（S07 Step 3）"
        state: { $ref: '#/components/schemas/WishState' }
        timing: { $ref: '#/components/schemas/Timing' }
        soft_deferred:
          type: boolean
          description: "true 表示本周提醒被预算顺延，前端显示「本周先不打扰你」（S03 EX-14.1）"
        degraded_reason:
          type: [string, "null"]
          enum: [llm_failed, asr_failed, asr_empty, null]
        version: { type: integer }

## MODIFIED — WishDetail

    WishDetail:
      allOf:
        - $ref: '#/components/schemas/WishCard'
        - type: object
          properties:
            original_text:
              type: [string, "null"]
              description: "用户原话。ASR 失败时为 null（S02 EX-15.1）"
            audio_media_id: { type: [string, "null"], format: uuid }
            photo_media_ids:
              type: array
              items: { type: string, format: uuid }
            understanding:
              oneOf:
                - $ref: '#/components/schemas/WishUnderstanding'
                - type: "null"
            pending_question:
              type: boolean
              description: "true 表示有一句「待未来再问」的追问"
            amended_from:
              type: [string, "null"]
              description: "「最初你说的是……」，来自 amendments 最早的一条快照（S04 EX-23.1）"
            current_step:
              oneOf:
                - $ref: '#/components/schemas/WishStep'
                - type: "null"
            timeline:
              type: array
              items: { $ref: '#/components/schemas/TimelineEntry' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/WishMessage' }

## MODIFIED — letGoWish

  /wishes/{wish_id}/let-go:
    parameters:
      - $ref: '#/components/parameters/WishId'
    post:
      operationId: letGoWish
      tags: [wishes]
      summary: "安静放下"
      description: "来源：S05.2 Step 17 → Step 21。同一事务内记录 let_go_at、清空 next_trigger_at 并删除所有 pending 提醒（S05.2 步骤说明）。响应文案禁止出现失败/放弃/未完成。"
      responses:
        '200':
          description: "已安静放下，保留标题、原话与首次种下时间"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishDetail' }
        '409':
          description: "愿望已是 happened 终态，不可回退（STATE_TRANSITION_NOT_ALLOWED，S05 EX-17.1）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
