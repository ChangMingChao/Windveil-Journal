<!DOCTYPE html>

<title>原型 · 唤回一个被安静放下的愿望（S07）— 未发生事件管理局</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Raleway:wght@300;400;500;600&display=swap');
:root{--paper:#FDFBF7;--card:#F5F0E1;--ink:#2C2620;--ink-soft:#5C5347;--clay:#92400E;--mist-deep:#4A6572;--sprout-deep:#4F5C2C;--mist:#8FA5B0;--sprout:#6B7B3C;--lamp:#E8B96B;--line:#E3DCCB;--leaf:#A8A29E;--r-card:18px;--r-input:14px;--sh-card:0 6px 20px rgba(44,38,32,.06);--f-h:'Lora','Noto Serif SC',Georgia,'Songti SC',serif;--f-b:'Raleway','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#EFE9DC;color:var(--ink);font:400 16px/1.7 var(--f-b);padding:24px 16px 64px}h1,h2,h3{font-family:var(--f-h);font-weight:500;margin:0}.doc{max-width:1180px;margin:0 auto}.doc-head h1{font-size:24px}.doc-head p{color:var(--ink-soft);font-size:14px;margin:6px 0 0;max-width:70ch}.stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin-top:22px}.frame{width:375px;flex:0 0 375px;margin:0}.frame figcaption{font-size:13px;color:var(--ink-soft);margin-bottom:8px}.screen{position:relative;height:760px;background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 34px rgba(44,38,32,.10);overflow:hidden;display:flex;flex-direction:column}.sbar{padding:14px 16px 0;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between}.body{flex:1 1 auto;overflow:auto;padding:16px 16px 92px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title-h{font-family:var(--f-h);font-size:22px;line-height:1.4}.meta{font-size:13px;color:var(--ink-soft)}.tabs{display:flex;gap:8px;overflow:auto;margin:18px -2px 12px;padding:2px}.pill{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink-soft);background:rgba(245,240,225,.62)}.pill.active{color:var(--clay);border-color:var(--clay);background:#fff8ef}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:16px;margin:12px 0}.card h3{font-size:18px;line-height:1.35}.quote{font-style:italic;color:var(--ink-soft);font-size:15px;line-height:1.75}.badge{display:inline-flex;align-items:center;gap:7px;color:#6B6257;font-size:13px}.dot{width:9px;height:9px;border-radius:999px;background:var(--leaf)}.leaf{width:20px;height:10px;border:1px solid #9B948B;border-radius:100% 0 100% 0;transform:rotate(-18deg)}.btn{font:500 16px/1 var(--f-b);min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;cursor:pointer}.btn-primary{background:var(--clay);color:#fff}.btn-ghost{background:transparent;color:var(--clay);border-color:var(--line)}.btn-text{background:none;border:none;color:var(--clay);font:400 14px/1 var(--f-b);min-height:44px;padding:0 6px;text-decoration:underline;text-underline-offset:3px}.bottom-nav{position:absolute;left:0;right:0;bottom:0;background:rgba(253,251,247,.94);border-top:1px solid var(--line);padding:10px 18px 18px;display:flex;justify-content:space-between;align-items:center}.plant{width:64px;height:64px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(146,64,14,.18);font-weight:600}.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);border-radius:26px 26px 0 0;box-shadow:0 -12px 30px rgba(44,38,32,.16);padding:18px 18px 24px}.sheet-handle{width:44px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 18px}.timeline{border-left:1px solid var(--line);margin:16px 0 0 8px;padding-left:16px}.timeline p{margin:0 0 14px}.success{background:#fff7e8;border:1px solid #EED7AE;border-radius:16px;padding:12px;color:var(--clay);font-size:14px;margin:12px 0}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:36px}.empty .moon{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#FFF7DF,#E8B96B);margin:0 auto 18px;box-shadow:0 10px 24px rgba(232,185,107,.22)}.btn:focus-visible,.btn-text:focus-visible{outline:2px solid var(--clay);outline-offset:2px}@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="doc">
  <div class="doc-head">
    <h1>S07 · 唤回一个被安静放下的愿望</h1>
    <p>四个屏：「安静放下」区列表、唤回半屏、重新种下后的时机约定入口、空态。设计令牌沿用既有 <code>design-system.json</code>，文案避免「放弃」「未完成」与计数压力。</p>
  </div>
  <div class="stage">
    <figure class="frame">
      <figcaption>1 / 安静放下区列表：按放下时间倒序，无总数。</figcaption>
      <section class="screen" aria-label="安静放下区列表">
        <div class="sbar"><span>9:41</span><span>未发生事件管理局</span></div>
        <div class="body">
          <div class="row"><div><h2 class="title-h">未发生之地</h2><p class="meta">那些被安静收好的事，也还在这里。</p></div><button class="btn-text">我的</button></div>
          <div class="tabs" aria-label="状态筛选"><span class="pill">全部</span><span class="pill">刚种下</span><span class="pill">正在酝酿</span><span class="pill active">安静放下</span></div>
          <article class="card"><div class="row"><span class="badge"><span class="dot"></span><span class="leaf"></span>安静放下</span><span class="meta">放下于 8 月</span></div><h3>重新开始画画</h3><p class="quote">“只是想在晚上有一小段时间，重新拿起画笔。”</p><p class="meta">种下于 2026 年 3 月</p></article>
          <article class="card"><div class="row"><span class="badge"><span class="dot"></span><span class="leaf"></span>安静放下</span><span class="meta">放下于 7 月</span></div><h3>一个人去看海</h3><p class="quote">“想找个周末，只听海浪，不回复任何消息。”</p><p class="meta">种下于 2026 年 1 月</p></article>
        </div>
        <nav class="bottom-nav"><span>未发生之地</span><span class="plant">种下</span><span>已发生之书</span></nav>
      </section>
    </figure>
    <figure class="frame">
      <figcaption>2 / 唤回半屏：原话、首次种下时间、放下时间与两个出口。</figcaption>
      <section class="screen" aria-label="唤回半屏">
        <div class="sbar"><span>9:41</span><span>愿望详情</span></div>
        <div class="body"><button class="btn-text">← 回到安静放下区</button><h2 class="title-h">重新开始画画</h2><p class="meta">种下于 2026 年 3 月 · 放下于 2026 年 8 月</p><div class="card"><p class="quote">“只是想在晚上有一小段时间，重新拿起画笔。”</p></div><div class="timeline"><p><strong>准备过程还在</strong><br><span class="meta">你曾收藏过三张喜欢的色卡。</span></p></div></div>
        <div class="sheet"><div class="sheet-handle"></div><h2 class="title-h">还想让它再等一阵风吗</h2><p class="meta">重新种下会保留当初写下的内容。它会先回到「刚种下」，你可以稍后再约定时机。</p><div class="row" style="margin-top:18px"><button class="btn btn-primary">重新种下</button><button class="btn btn-ghost">再放一会儿</button></div></div>
      </section>
    </figure>
    <figure class="frame">
      <figcaption>3 / 重新种下后：回到刚种下，并引导复用 S03。</figcaption>
      <section class="screen" aria-label="重新种下后的时机入口">
        <div class="sbar"><span>9:41</span><span>愿望详情</span></div>
        <div class="body"><div class="success">已经重新种下了。它还是从 2026 年 3 月那天开始被保存。</div><div class="row"><div><h2 class="title-h">重新开始画画</h2><p class="meta">状态：刚种下 · 种下于 2026 年 3 月</p></div><span class="badge"><span class="dot" style="background:var(--sprout)"></span>刚种下</span></div><div class="card"><p class="quote">“只是想在晚上有一小段时间，重新拿起画笔。”</p></div><button class="btn btn-primary">约定一个时机</button><button class="btn btn-ghost" style="margin-left:8px">先让它待着</button><div class="card"><h3>选择一个不催促的时机</h3><p class="meta">入冬、某个月份、几个月后、空闲周末、当我提到很累时，或不必提醒。</p></div></div>
        <nav class="bottom-nav"><span>未发生之地</span><span class="plant">种下</span><span>已发生之书</span></nav>
      </section>
    </figure>
    <figure class="frame">
      <figcaption>4 / 空态：不显示 0，不诱导制造一条放下记录。</figcaption>
      <section class="screen" aria-label="安静放下空态">
        <div class="sbar"><span>9:41</span><span>未发生之地</span></div>
        <div class="body"><div class="row"><h2 class="title-h">未发生之地</h2><button class="btn-text">我的</button></div><div class="tabs"><span class="pill">全部</span><span class="pill">刚种下</span><span class="pill">正在酝酿</span><span class="pill active">安静放下</span></div><div class="empty"><div><div class="moon"></div><h2 class="title-h">这里还没有被安静收好的事</h2><p class="meta">如果有一天你想让某件事先停一停，它会被好好放在这里。</p><button class="btn btn-ghost">看看全部愿望</button></div></div></div>
        <nav class="bottom-nav"><span>未发生之地</span><span class="plant">种下</span><span>已发生之书</span></nav>
      </section>
    </figure>
  </div>
</div>
</body>
</html>
