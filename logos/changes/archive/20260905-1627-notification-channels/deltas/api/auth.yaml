# delta — api/auth.yaml（notification-channels）

## ADDED — PATCH /me/notification-channels

```yaml
  /me/notification-channels:
    patch:
      operationId: updateNotificationChannels
      tags: [auth]
      summary: "切换提醒通道开关（S10）"
      description: |
        来源：S10 Step 6 → Step 10。读写 users.push_enabled / email_enabled（既有列）。
        请求只含变更的字段（minProperties: 1）；切换立即生效，无冷静期。
        投递侧语义：推送关闭时投递直接走邮件；全部关闭时 outbox 的 pending 记录
        顺延保留、重开后恢复（S10 EX-D2.1）——已确认的时机不因关通道丢失。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                push_enabled: { type: boolean }
                email_enabled: { type: boolean }
      responses:
        '200':
          description: "已更新；返回完整开关状态"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannels' }
        '422':
          description: "请求体为空或无已知字段（VALIDATION_FAILED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: "未认证（UNAUTHENTICATED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
```

## MODIFIED — schemas: UserProfile（开关状态随 GET /me 返回）

```yaml
    UserProfile:
      type: object
      required: [id, is_anonymous, onboarded_at, timezone, push_enabled, email_enabled]
      properties:
        id: { type: string, format: uuid }
        email:
          type: [string, "null"]
          format: email
          description: "未绑定邮箱时为 null"
        is_anonymous:
          type: boolean
          description: "true 表示尚未绑定邮箱，换设备后无法找回"
        onboarded_at:
          type: [string, "null"]
          format: date-time
          description: "首次体验完成时间。非空即不再进入 /welcome（EX-12.1）"
        timezone:
          type: string
          description: "IANA 时区名，提醒周预算按该时区的自然周计算"
        push_enabled:
          type: boolean
          description: "推送通道开关（S10）。关闭时投递直接走邮件；两个都关则完全静默"
        email_enabled:
          type: boolean
          description: "邮件通道开关（S10）。iOS Safari 未添加主屏时建议保持开启"
        created_at: { type: string, format: date-time }
```

## ADDED — schema: NotificationChannels

```yaml
    NotificationChannels:
      type: object
      required: [push_enabled, email_enabled]
      properties:
        push_enabled:
          type: boolean
          description: "推送通道开关；关闭后投递不再尝试推送"
        email_enabled:
          type: boolean
          description: "邮件通道开关；关闭后投递不再尝试邮件。两个都关 = 完全静默（pending 顺延保留）"
```
