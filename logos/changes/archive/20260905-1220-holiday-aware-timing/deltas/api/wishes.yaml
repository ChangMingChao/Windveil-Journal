# delta — api/wishes.yaml（holiday-aware-timing）

> 合并注记：主文档 wishes.yaml 无独立的 `ProposalEvidence` schema（上个提案将 items 内联在 `TimingProposal.evidence` 中），因此本文件的第一个 MODIFIED 落地为主文档 `TimingProposal.evidence` 的整段替换；第二个 MODIFIED 与其内容一致，未重复应用。

## MODIFIED — schema: ProposalEvidence

```yaml
    ProposalEvidence:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [preference, availability, timeline, calendar]
          description: "calendar 为节假日数据条目（holiday-aware-timing）：建议理由引用了内置节假日事实"
        id:
          type: string
          description: "依据条目标识。preference/availability 为对应行的 UUID；timeline 为愿望 UUID；calendar 为数据文件标识（如 holidays-2026），不是 UUID——数据是全局公共事实，没有用户数据行可指"
```

> 同步说明：`TimingProposal.evidence` 的既有描述「只存 ID 不复制内容」不变——calendar 条目的 id 指向数据文件版本，文件更新（次年新文件）后旧引用自然指向旧数据标识，同样满足「条目删除/更新后引用可追溯」的语义。

## MODIFIED — schema: TimingProposal（evidence 字段描述同步）

```yaml
        evidence:
          type: array
          description: "依据条目引用；只存标识不复制内容（架构 5.3 增补）。节假日来源以 calendar 条目表示（holiday-aware-timing）"
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
                enum: [preference, availability, timeline, calendar]
              id: { type: string }
```
