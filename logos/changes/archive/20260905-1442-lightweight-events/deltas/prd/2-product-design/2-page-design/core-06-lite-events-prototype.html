<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 先记一下并随手划掉（S09）— 未发生事件管理局</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Raleway:wght@300;400;500;600&display=swap');
:root{--paper:#FDFBF7;--card:#F5F0E1;--ink:#2C2620;--ink-soft:#5C5347;--clay:#92400E;--mist-deep:#4A6572;--sprout-deep:#4F5C2C;--mist:#8FA5B0;--sprout:#6B7B3C;--lamp:#E8B96B;--line:#E3DCCB;--leaf:#A8A29E;--r-card:18px;--r-input:14px;--sh-card:0 6px 20px rgba(44,38,32,.06);--f-h:'Lora','Noto Serif SC',Georgia,'Songti SC',serif;--f-b:'Raleway','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#EFE9DC;color:var(--ink);font:400 16px/1.7 var(--f-b);padding:24px 16px 64px}h1,h2,h3{font-family:var(--f-h);font-weight:500;margin:0}.doc{max-width:1240px;margin:0 auto}.doc-head h1{font-size:24px}.doc-head p{color:var(--ink-soft);font-size:14px;margin:6px 0 0;max-width:74ch}.stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin-top:22px}.frame{width:375px;flex:0 0 375px;margin:0}.frame figcaption{font-size:13px;color:var(--ink-soft);margin-bottom:8px}.screen{position:relative;height:760px;background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 34px rgba(44,38,32,.10);overflow:hidden;display:flex;flex-direction:column}.sbar{padding:14px 16px 0;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between}.body{flex:1 1 auto;overflow:auto;padding:16px 16px 92px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title-h{font-family:var(--f-h);font-size:22px;line-height:1.4}.meta{font-size:13px;color:var(--ink-soft)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:16px;margin:12px 0}.quote{font-style:italic;color:var(--ink-soft);font-size:15px;line-height:1.75}.btn{font:500 16px/1 var(--f-b);min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;cursor:pointer}.btn-primary{background:var(--clay);color:#fff}.btn-ghost{background:transparent;color:var(--clay);border-color:var(--line)}.btn-text{background:none;border:none;color:var(--clay);font:400 14px/1 var(--f-b);min-height:44px;padding:0 6px;text-decoration:underline;text-underline-offset:3px}.input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:var(--r-input);background:#fff;padding:12px 14px;font:400 15px/1.5 var(--f-b);color:var(--ink)}.input::placeholder{color:var(--leaf)}.lite{border:1px solid var(--line);border-radius:14px;background:rgba(245,240,225,.55);padding:10px 14px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.lite span{font-size:15px}.lite .acts{display:flex;gap:4px}.lite .acts button{min-height:40px}.bottom-nav{position:absolute;left:0;right:0;bottom:0;background:rgba(253,251,247,.94);border-top:1px solid var(--line);padding:10px 18px 18px;display:flex;justify-content:space-between;align-items:center}.plant{width:64px;height:64px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(146,64,14,.18);font-weight:600}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:36px}.empty .moon{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#FFF7DF,#E8B96B);margin:0 auto 18px;box-shadow:0 10px 24px rgba(232,185,107,.22)}.tip{background:#F3F2E4;border:1px solid #DFDDBE;border-radius:14px;padding:10px 12px;color:var(--sprout-deep);font-size:13px;margin:10px 0}.strike{text-decoration:line-through;color:var(--leaf)}.btn:focus-visible,.input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="doc">
  <div class="doc-head">
    <h1>S09 · 先记一下并随手划掉</h1>
    <p>三个屏：P1「先记一下」展开区（主输入下方，与「种下」并存）、连续记录与划掉后的列表状态、空态。设计令牌沿用既有 <code>design-system.json</code>；无条数统计、无时间戳、无提醒开关、无升格按钮。</p>
  </div>
  <div class="stage">
    <figure class="frame">
      <figcaption>1 / P1「先记一下」展开区：主输入不变，次级入口在下方；记录即置顶出现，输入框清空可连续记。</figcaption>
      <section class="screen" aria-label="先记一下展开区">
        <div class="sbar"><span>9:41</span><span>种下一个愿望</span></div>
        <div class="body">
          <h2 class="title-h">今天，有什么想在未来发生的事吗？</h2>
          <input class="input" style="margin-top:12px" placeholder="比如：想在冬天学会滑雪">
          <button class="btn btn-primary" style="margin-top:10px">种下它</button>
          <hr style="border:0;border-top:1px dashed var(--line);margin:22px 0 14px">
          <button class="btn-text" style="padding-left:0">▾ 先记一下</button>
          <input class="input" style="margin-top:6px" placeholder="想到什么小事，一句话记下它">
          <button class="btn btn-ghost" style="margin-top:8px">记下</button>
          <div class="lite"><span>今晚吃火锅</span><span class="acts"><button class="btn-text">划掉了</button><button class="btn-text" style="color:var(--leaf)">收走</button></span></div>
          <div class="tip">这里的东西不会被提醒、不会被追问——划掉就完了。</div>
        </div>
        <nav class="bottom-nav"><span>未发生之地</span><span class="plant">种下</span><span>已发生之书</span></nav>
      </section>
    </figure>
    <figure class="frame">
      <figcaption>2 / 记了两条并划掉一条：列表只剩未划掉的；无任何数字与时间压力。</figcaption>
      <section class="screen" aria-label="轻事件列表状态">
        <div class="sbar"><span>9:41</span><span>种下一个愿望</span></div>
        <div class="body">
          <h2 class="title-h">今天，有什么想在未来发生的事吗？</h2>
          <input class="input" style="margin-top:12px" placeholder="比如：想重新开始画画">
          <button class="btn btn-primary" style="margin-top:10px">种下它</button>
          <hr style="border:0;border-top:1px dashed var(--line);margin:22px 0 14px">
          <button class="btn-text" style="padding-left:0">▾ 先记一下</button>
          <input class="input" style="margin-top:6px" placeholder="想到什么小事，一句话记下它">
          <button class="btn btn-ghost" style="margin-top:8px">记下</button>
          <div class="lite"><span>周末取快递</span><span class="acts"><button class="btn-text">划掉了</button><button class="btn-text" style="color:var(--leaf)">收走</button></span></div>
          <div class="lite"><span class="strike">今晚吃火锅</span><span class="meta">划掉了</span></div>
        </div>
        <nav class="bottom-nav"><span>未发生之地</span><span class="plant">种下</span><span>已发生之书</span></nav>
      </section>
    </figure>
    <figure class="frame">
      <figcaption>3 / 空态：只有输入与一句引导，无「你还没有记录」句式、无补齐引导。</figcaption>
      <section class="screen" aria-label="先记一下空态">
        <div class="sbar"><span>9:41</span><span>种下一个愿望</span></div>
        <div class="body">
          <h2 class="title-h">今天，有什么想在未来发生的事吗？</h2>
          <input class="input" style="margin-top:12px" placeholder="比如：想一个人去看海">
          <button class="btn btn-primary" style="margin-top:10px">种下它</button>
          <hr style="border:0;border-top:1px dashed var(--line);margin:22px 0 14px">
          <button class="btn-text" style="padding-left:0">▾ 先记一下</button>
          <input class="input" style="margin-top:6px" placeholder="想到什么小事，一句话记下它">
          <button class="btn btn-ghost" style="margin-top:8px">记下</button>
          <p class="meta" style="margin-top:10px">记下的事，划掉就完了。</p>
        </div>
        <nav class="bottom-nav"><span>未发生之地</span><span class="plant">种下</span><span>已发生之书</span></nav>
      </section>
    </figure>
  </div>
</div>
</body>
</html>
