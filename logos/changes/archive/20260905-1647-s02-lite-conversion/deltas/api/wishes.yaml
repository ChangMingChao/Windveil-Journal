## ADDED — POST /wishes/{wish_id}/convert-to-lite

```yaml
  /wishes/{wish_id}/convert-to-lite:
    parameters:
      - $ref: '#/components/parameters/WishId'
    post:
      operationId: convertWishToLiteEvent
      tags: [wishes]
      summary: "先记一下（把这条输入转成轻事件）"
      description: |
        来源：s02-lite-conversion 提案、S02 EX-18.2 增补。同一事务内删除 wish 行
        （照片关联与 pending 提醒一并级联清除）并新建同文本的 lite_event——
        Agent 理解结果不迁移（轻事件不需要），照片不迁移（轻事件无媒体）。
        仅 seeded 状态可转换（brewing 及以后拒绝：已确认时机的愿望转轻事件
        等于变相弃约）。
      responses:
        '201':
          description: "已转换为轻事件；原 wish_id 此后访问返回 404"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiteEvent' }
        '409':
          description: "当前状态不允许转换（仅 seeded 可转换，STATE_TRANSITION_NOT_ALLOWED）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "不存在或不属于当前用户（WISH_NOT_FOUND）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
```

> `LiteEvent` schema 定义于 `lite-events.yaml`（同目录，OpenAPI 合并时按 `$ref` 解析）。
