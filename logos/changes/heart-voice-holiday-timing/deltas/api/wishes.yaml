# delta — api/wishes.yaml（heart-voice-holiday-timing）

## ADDED — /holidays

  /holidays:
    get:
      operationId: listHolidays
      tags: [timing]
      summary: "法定节假日枚举（自己选时机用）"
      description: |
        来源：heart-voice-holiday-timing。供客户端「自己选时机」的节假日多选器。
        数据来自内置节假日数据文件（holiday-aware-timing 同源）；缺年份返回
        available=false 与空表，客户端据此提示「节假日数据暂不可用」，不做任何猜测。
        触发日计算仍在 PUT /wishes/{id}/timing 服务端完成。
      parameters:
        - name: year
          in: query
          schema: { type: integer }
          description: "年份，缺省为当前年份"
      responses:
        '200':
          description: "节假日枚举"
          content:
            application/json:
              schema:
                type: object
                required: [year, available, names, items]
                properties:
                  year: { type: integer }
                  available: { type: boolean }
                  names:
                    type: array
                    description: "去重后的节假日名（多选器的选项）"
                    items: { type: string }
                  items:
                    type: array
                    description: "date + name 明细（按日期升序）"
                    items:
                      type: object
                      required: [date, name]
                      properties:
                        date: { type: string, format: date }
                        name: { type: string }

## MODIFIED — TimingInput

    TimingInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [season, month_day, after_months, free_weekend, when_tired, none, holiday]
          description: |
            holiday 为 heart-voice-holiday-timing 新增：用户从 GET /holidays 的
            names 中多选法定节假日。season/month_day/after_months/free_weekend/
            when_tired/none 语义不变（Web 端仍可用全量枚举，Android 端 UI 收敛为
            holiday/month_day/提议三类）。
        season:
          type: string
          enum: [spring, summer, autumn, winter]
        month_day:
          type: string
          pattern: '^\d{4}-\d{2}(-\d{2})?$'
          description: "某个月份（YYYY-MM）或某个纪念日（YYYY-MM-DD）"
        after_months:
          type: integer
          enum: [1, 3, 6, 12]
        holidays:
          type: array
          maxItems: 5
          description: "type=holiday 时必填：所选法定节假日名（一个或多个）；服务端取最近到来的一个匹配日"
          items: { type: string }
