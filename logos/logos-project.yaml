project:
  name: "Windveil-Journal"
  description: 未发生事件管理局 — 个人愿望陪伴产品：收集那些你不想错过的未来，并在你准备好时，陪它们慢慢发生。
  methodology: OpenLogos
tech_stack:
  architecture: 前后端分离 + 单体后端 + 单数据库 + 独立调度进程
  frontend:
    language: TypeScript 5.x
    framework: React 19 + Vite 6
    router: React Router 7
    data: TanStack Query 5
    styling: Tailwind CSS 4（@theme 映射 design-system.json 令牌）
    pwa: vite-plugin-pwa (Workbox)
    test: Vitest + Testing Library + Playwright
    package_manager: pnpm
  backend:
    language: Python 3.12
    framework: FastAPI 0.115+
    validation: Pydantic v2
    orm: SQLAlchemy 2.0 (async, aiosqlite)
    migration: Alembic（SQLite 下改列须用 batch_alter_table）
    auth: 自管 JWT（Argon2id + access/refresh，refresh 存 httpOnly Cookie）
    scheduler: APScheduler 3.x 独立进程 + 单写者文件锁（SQLite 无咨询锁）
    test: pytest + pytest-asyncio + httpx.AsyncClient（无需外部服务）
    package_manager: uv
  database: SQLite 3.40+（单文件，WAL；无 RLS，隔离改为仓储层注入 + 应用层 owner_guard；understanding 存 JSON 文本）
  object_storage: S3 兼容（本地 MinIO，生产可换 R2 / 云 OSS）
  llm:
    protocol: OpenAI 兼容 /v1/chat/completions
    client: openai Python SDK（base_url / api_key / model 由环境变量注入）
    note: 供应商中立为硬约束；结构化输出用 response_format json_schema + Pydantic 二次校验；超时 5s 后返回 None 触发产品级降级
  asr:
    protocol: OpenAI 兼容 /v1/audio/transcriptions
    note: 失败时保留原始音频，支持重试转写
  api_style: REST /api/v1，OpenAPI 3.1 由 FastAPI 自动产出（前端类型由此生成）
  deploy_units:
    - 静态站点
    - api (uvicorn)
    - scheduler (单活)
  deploy_constraint: Docker Compose；环境变量注入全部配置与密钥；Alembic 先迁移后切流；数据库为单文件，备份即复制文件 + ENCRYPTION_KEY 分开存放
external_dependencies:
  - name: LLM
    provider: 任意 OpenAI 兼容端点（供应商未定，代码不得写死）
    used_in:
      - S01-新用户建立自己的未发生之地
      - S02-随手种下一个愿望并被理解
      - S04-风来了，开始第一小步
      - S06-把发生过的事写成一页记忆
    test_strategy: mock-service
    test_config: 本地 OpenAI 兼容 mock，返回固定结构化 JSON；提供强制失败开关以覆盖降级验收条件
  - name: 语音转写 ASR
    provider: 任意 OpenAI 兼容端点
    used_in:
      - S02-随手种下一个愿望并被理解
    test_strategy: mock-service
    test_config: 同 LLM mock 服务；失败模式用于验证保留原始音频与重试转写
  - name: Web Push
    provider: 浏览器推送服务（VAPID）
    used_in:
      - S03-为一个愿望约定属于它的时机
      - S04-风来了，开始第一小步
    test_strategy: env-disable
    test_config: APP_ENV=test 时不真实投递，仅写 reminder_outbox；配套 GET /api/test/outbox?user_id= 断言周预算与去重
  - name: 邮件服务
    provider: SMTP 或供应商 API（抽象为 EmailSender）
    used_in:
      - S03-为一个愿望约定属于它的时机
    test_strategy: test-api
    test_config: GET /api/test/latest-email?to={email}
  - name: 对象存储
    provider: S3 兼容（本地 MinIO）
    used_in:
      - S02-随手种下一个愿望并被理解
      - S06-把发生过的事写成一页记忆
    test_strategy: fixed-value
    test_config: 本地 MinIO 真实调用，固定 bucket 与凭证；预签名 URL 正确性本身是被测行为，不 mock
  - name: 系统时钟
    provider: 服务层 Clock 抽象
    used_in:
      - S03-为一个愿望约定属于它的时机
      - S04-风来了，开始第一小步
      - S06-把发生过的事写成一页记忆
    test_strategy: fixed-value
    test_config: 测试注入固定时间，用于时机到达、60 天停滞、发生日期早于种下日期等断言
